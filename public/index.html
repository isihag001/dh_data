<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Marwari Audio Collection</title>
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<div class="container">
  <div class="header">
    <div class="kicker">Marwari Audio Collection</div>
    <h1 class="title" id="page-title">हिंदी सुनें, मारवाड़ी में बोलें</h1>
    <div class="subtitle" id="page-subtitle">A research project for collecting Hindi to Marwari translations</div>
  </div>

  <div id="loading" class="empty-state"><div class="spinner"></div></div>

  <!-- Login view -->
  <div id="login-view" style="display:none;">
    <div class="card" style="max-width: 420px; margin: 0 auto;">
      <div class="section-label">Sign in</div>
      <div id="login-error" class="alert alert-error" style="display:none;"></div>
      <form id="login-form">
        <div class="form-row">
          <label for="username">Username</label>
          <input type="text" id="username" required autofocus autocomplete="username" />
        </div>
        <div class="form-row">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn-primary" style="width:100%;">Sign in</button>
      </form>
      <div class="muted mt-1" style="font-size: 0.85rem; text-align: center;">
        Don't have credentials? Contact the project admin.
      </div>
    </div>
  </div>

  <!-- Dataset picker view -->
  <div id="picker-view" style="display:none;">
    <div class="row row-between mb-1">
      <div class="muted" style="font-size: 0.9rem;">Signed in as <strong id="current-user"></strong></div>
      <button id="logout-btn">Sign out</button>
    </div>
    <div class="section-label">Available datasets</div>
    <div id="datasets-list"></div>
  </div>
</div>

<script>
function escapeHtml(str) {
  return String(str || '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

async function checkAuth() {
  try {
    const res = await fetch('/api/me');
    const data = await res.json();
    document.getElementById('loading').style.display = 'none';
    if (data.authenticated) {
      document.getElementById('current-user').textContent = data.user.username;
      document.getElementById('picker-view').style.display = 'block';
      loadDatasets();
    } else {
      document.getElementById('login-view').style.display = 'block';
    }
  } catch (err) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('login-view').style.display = 'block';
  }
}

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errBox = document.getElementById('login-error');
  errBox.style.display = 'none';
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Login failed');
    location.reload();
  } catch (err) {
    errBox.textContent = err.message;
    errBox.style.display = 'block';
  }
});

document.getElementById('logout-btn').addEventListener('click', async () => {
  await fetch('/api/logout', { method: 'POST' });
  location.reload();
});

async function loadDatasets() {
  const list = document.getElementById('datasets-list');
  list.innerHTML = '<div class="empty-state"><div class="spinner"></div></div>';
  try {
    const res = await fetch('/api/datasets');
    const data = await res.json();
    if (!data.datasets || data.datasets.length === 0) {
      list.innerHTML = '<div class="empty-state"><div class="empty-state-title">No datasets available yet</div><div class="empty-state-sub">Please check back soon.</div></div>';
      return;
    }
    list.innerHTML = '';
    data.datasets.forEach(d => {
      const card = document.createElement('div');
      card.className = 'card';
      card.style.cursor = 'pointer';
      card.innerHTML = `
        <div class="row row-between">
          <div style="flex: 1; min-width: 0;">
            <div style="font-size: 1.1rem; font-weight: 600; margin-bottom: 0.3rem;">${escapeHtml(d.title)}</div>
            <div class="muted" style="font-size: 0.9rem; margin-bottom: 0.5rem;">${escapeHtml(d.description || '')}</div>
            <div class="row" style="gap: 0.5rem;">
              <span class="pill">${d.sentence_count} sentences</span>
              <span class="pill">${escapeHtml(d.source_language)} → ${escapeHtml(d.target_language)}</span>
            </div>
          </div>
          <button class="btn-primary">Start →</button>
        </div>
      `;
      card.addEventListener('click', () => {
        window.location.href = '/record?dataset=' + encodeURIComponent(d.id);
      });
      list.appendChild(card);
    });
  } catch (err) {
    if (err.message && err.message.includes('401')) {
      location.reload();
      return;
    }
    list.innerHTML = '<div class="alert alert-error">Failed to load datasets.</div>';
  }
}

checkAuth();
</script>
</body>
</html>
